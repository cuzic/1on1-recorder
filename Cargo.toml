[workspace]
resolver = "2"
members = [
    "apps/desktop",
    "crates/app-service",
    "crates/audio-timeline",
    "crates/capture-api",
    "crates/capture-macos",
    "crates/capture-windows",
    "crates/credential-store",
    "crates/recorder-domain",
    "crates/segment-store",
    "crates/session-store",
    "crates/stt-api",
    "crates/stt-deepgram",
    "crates/summarize",
    "crates/upload-client",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cuzic/1on1-recorder"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
