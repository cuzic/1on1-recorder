[package]
name = "stt-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Provider-agnostic streaming speech-to-text abstraction: a trait for starting a session, sending audio, and receiving partial/final transcripts, plus a centrally-named `extra` mechanism for provider-specific capabilities."
readme = "README.md"
keywords = ["speech-to-text", "stt", "transcription", "streaming", "async"]
categories = ["multimedia::audio", "asynchronous"]

[dependencies]
async-trait = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["sync"] }
