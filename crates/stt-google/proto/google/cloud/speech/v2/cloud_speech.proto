// Trimmed copy of a subset of
// https://github.com/googleapis/googleapis/blob/master/google/cloud/speech/v2/cloud_speech.proto
// (fetched 2026-07-17), keeping only the `Speech.StreamingRecognize` RPC and the
// message tree it needs. Field names/numbers match the upstream proto exactly, so
// this stays wire-compatible with the real `speech.googleapis.com` service; only
// `google.api.*` annotations (HTTP transcoding/resource metadata, irrelevant to a
// raw gRPC bidi stream) and unrelated RPCs/messages (Recognize, BatchRecognize,
// Recognizer/CustomClass/PhraseSet resource management, ...) are dropped.
syntax = "proto3";

package google.cloud.speech.v2;

import "google/protobuf/duration.proto";

service Speech {
  // Bidirectional streaming speech recognition: receive results while sending
  // audio. gRPC-only (no REST/WebSocket equivalent).
  rpc StreamingRecognize(stream StreamingRecognizeRequest)
      returns (stream StreamingRecognizeResponse) {}
}

// The first message on the stream carries `streaming_config`; every message
// after that carries only `audio`.
message StreamingRecognizeRequest {
  string recognizer = 3;

  oneof streaming_request {
    StreamingRecognitionConfig streaming_config = 6;
    bytes audio = 5;
  }
}

message StreamingRecognitionConfig {
  RecognitionConfig config = 1;
  StreamingRecognitionFeatures streaming_features = 2;
}

message StreamingRecognitionFeatures {
  bool enable_voice_activity_events = 1;
  bool interim_results = 2;
}

message RecognitionConfig {
  oneof decoding_config {
    AutoDetectDecodingConfig auto_decoding_config = 7;
    ExplicitDecodingConfig explicit_decoding_config = 8;
  }
  string model = 9;
  repeated string language_codes = 10;
  RecognitionFeatures features = 2;
  SpeechAdaptation adaptation = 6;
}

message AutoDetectDecodingConfig {}

message ExplicitDecodingConfig {
  enum AudioEncoding {
    AUDIO_ENCODING_UNSPECIFIED = 0;
    LINEAR16 = 1;
    MULAW = 2;
    ALAW = 3;
    AMR = 4;
    AMR_WB = 5;
    FLAC = 6;
    MP3 = 7;
    OGG_OPUS = 8;
    WEBM_OPUS = 9;
    MP4_AAC = 10;
    M4A_AAC = 11;
    MOV_AAC = 12;
  }
  AudioEncoding encoding = 1;
  int32 sample_rate_hertz = 2;
  int32 audio_channel_count = 3;
}

message RecognitionFeatures {
  bool enable_word_time_offsets = 2;
  bool enable_word_confidence = 3;
  bool enable_automatic_punctuation = 4;
  // Setting this to a (possibly empty) message enables diarization; see
  // `SpeakerDiarizationConfig` doc comment below.
  SpeakerDiarizationConfig diarization_config = 9;
}

// To enable diarization, set this field to an empty `SpeakerDiarizationConfig`
// message (per upstream doc comment on `RecognitionFeatures.diarization_config`).
message SpeakerDiarizationConfig {
  int32 min_speaker_count = 2;
  int32 max_speaker_count = 3;
}

// Inline word/phrase biasing ("vocabulary boost"), the v2 equivalent of v1's
// `speech_contexts`.
message SpeechAdaptation {
  message AdaptationPhraseSet {
    oneof value {
      string phrase_set = 1;
      PhraseSet inline_phrase_set = 2;
    }
  }
  repeated AdaptationPhraseSet phrase_sets = 1;
}

message PhraseSet {
  message Phrase {
    string value = 1;
    float boost = 2;
  }
  repeated Phrase phrases = 3;
}

message StreamingRecognizeResponse {
  enum SpeechEventType {
    SPEECH_EVENT_TYPE_UNSPECIFIED = 0;
    END_OF_SINGLE_UTTERANCE = 1;
    SPEECH_ACTIVITY_BEGIN = 2;
    SPEECH_ACTIVITY_END = 3;
  }

  repeated StreamingRecognitionResult results = 6;
  SpeechEventType speech_event_type = 3;
}

message StreamingRecognitionResult {
  repeated SpeechRecognitionAlternative alternatives = 1;
  bool is_final = 2;
  // End of this result relative to the beginning of the audio. There is no
  // corresponding `result_start_offset` field upstream — only per-word offsets
  // (below) carry a start time.
  google.protobuf.Duration result_end_offset = 4;
  string language_code = 6;
}

message SpeechRecognitionAlternative {
  string transcript = 1;
  float confidence = 2;
  repeated WordInfo words = 3;
}

message WordInfo {
  google.protobuf.Duration start_offset = 1;
  google.protobuf.Duration end_offset = 2;
  string word = 3;
  float confidence = 4;
  // Set only if diarization is enabled *and* supported for the active
  // model/language/method combination; see crate root doc comment.
  string speaker_label = 6;
}
