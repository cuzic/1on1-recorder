[package]
name = "local-broker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "In-process pub/sub broker for decoupling transcription events from downstream consumers. Phase 1 uses tokio::broadcast; Phase 2 will add IPC transport via interprocess."

[dependencies]
dashmap = "6"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["sync"] }
transcript-event = { path = "../transcript-event" }

[dev-dependencies]
# For `#[tokio::test]` in `subscription.rs`'s tests.
tokio = { version = "1", features = ["sync", "rt", "macros"] }