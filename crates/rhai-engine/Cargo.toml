[package]
name = "rhai-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rhai scripting engine for 1on1 Recorder plugins. Provides a hook-based event dispatch system with a generic async command dispatcher for AI/HTTP calls."

[dependencies]
rhai = { version = "=1.20.0", features = ["sync"] }
dashmap = "6"
local-broker = { path = "../local-broker" }
transcript-event = { path = "../transcript-event" }
session-store = { path = "../session-store" }
credential-store = { path = "../credential-store" }
recorder-domain = { path = "../recorder-domain" }
summarize = { path = "../summarize" }
serde_json = { workspace = true }
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }
tracing = "0.1"
thiserror = { workspace = true }
chrono = "0.4"
genai = "0.7.0-beta.13"
reqwest = { version = "0.12", features = ["json"] }
jsonwebtoken = "9"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hmac = "0.12"