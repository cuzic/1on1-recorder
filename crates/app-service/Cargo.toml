[package]
name = "app-service"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Orchestrates capture -> align -> segment -> upload for the meeting recorder. Stage 1: an OS-independent pipeline driven by a pseudo capture source, proving the wiring between audio-timeline, segment-store, session-store, and upload-client without any real OS capture backend."

[dependencies]
audio-timeline = { path = "../audio-timeline" }
capture-api = { path = "../capture-api", optional = true }
capture-macos = { path = "../capture-macos", optional = true }
capture-windows = { path = "../capture-windows", optional = true }
chrono = "0.4"
credential-store = { path = "../credential-store", optional = true }
crossbeam-channel = { version = "0.5", optional = true }
recorder-domain = { path = "../recorder-domain" }
screencapturekit = { version = "8", features = ["macos_15_0"], optional = true }
segment-store = { path = "../segment-store" }
serde_json = { workspace = true, optional = true }
session-store = { path = "../session-store" }
stt-api = { path = "../stt-api", optional = true }
stt-assemblyai = { path = "../stt-assemblyai", optional = true }
stt-deepgram = { path = "../stt-deepgram", optional = true }
stt-google = { path = "../stt-google", optional = true }
stt-openai = { path = "../stt-openai", optional = true }
thiserror = { workspace = true }
# "time" for the upload worker's retry-pacing sleep (task #11) — needed
# unconditionally since the upload worker itself is OS-independent, unlike
# windows-supervisor's own extra tokio features (see that feature below).
# "sync" for the live-transcription side channel (`mpsc`, see
# `windows_frame_collector`/`live_transcription`) — cheap (no extra crates pulled
# in), unlike stt-deepgram's websocket/TLS stack, so it stays unconditional rather
# than living behind the `live-transcription` feature below.
tokio = { version = "1", features = ["time", "sync"] }
tracing = { version = "0.1", optional = true }
upload-client = { path = "../upload-client" }
windows = { version = "0.58", features = ["Win32_Media_Audio", "Win32_System_Com"], optional = true }

[dev-dependencies]
# For a minimal `SttSession` test double in `live_transcription`'s
# `silence_gate_enabled` wiring tests (mirrors `stt-api`'s own `async-trait`
# version) — `SttSession::send_audio`/`finalize`/`keep_alive` are `#[async_trait]`
# methods, so implementing the trait needs the same macro `stt-api` itself uses.
async-trait = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
upload-client = { path = "../upload-client", features = ["mock-server"] }

[features]
# Task #1/#10: the Windows supervisor connecting capture-api's FSM to real
# capture-windows capture threads, and the conversion layer/session wiring that
# feeds its frames into stage 1's pipeline. Only meaningful on Windows
# (capture-windows itself is Windows-only) — this crate's default (no-features)
# build stays OS-independent for stage 1's pseudo-source pipeline and stage 3's
# upload worker/session lifecycle.
windows-supervisor = ["dep:capture-api", "dep:capture-windows", "dep:credential-store", "dep:crossbeam-channel", "dep:tracing", "dep:windows", "tokio/rt", "tokio/macros"]

# The macOS analogue of windows-supervisor: connects capture-api's FSM to real
# capture-macos (ScreenCaptureKit) capture threads via macos_supervisor, plus the
# conversion layer/session wiring (macos_frame_collector/macos_session) that feeds
# its frames into stage 1's pipeline. Only meaningful on macOS (capture-macos
# itself is macOS-only, and — unlike capture-windows — has not yet been compiled or
# run at all; see capture-macos's crate doc comment).
macos-supervisor = ["dep:capture-api", "dep:capture-macos", "dep:crossbeam-channel", "dep:screencapturekit", "dep:tracing", "tokio/rt"]

# Real-time transcription during a Windows recording (design's "録音中にリアルタイム
# で文字起こしを表示したい"): opens Deepgram streaming STT sessions and persists
# `SttEvent`s via `session-store` as `windows_frame_collector::collect_frames`
# produces frames, instead of waiting for the batch `run_pipeline` stage 1/2 already
# do. Layered on top of (not merged into) `windows-supervisor` so a plain
# `--features windows-supervisor` build never pulls in stt-deepgram's
# websocket/TLS stack (`tokio-tungstenite`/`native-tls`) — `windows_session`'s
# `live_transcription` module compiles to a no-op stub without this feature. No
# macOS equivalent yet: `capture-macos`/`macos_frame_collector`/`macos_session`
# would need the identical `stt_sink`/`live_transcription` extension point once
# that crate is ever actually compiled/run (see its own crate doc comment) — not
# done here since macOS capture itself isn't in scope yet.
#
# Task #48: all four `stt-*` adapters are pulled in together (rather than one
# feature per provider) since `SttProviderKind` is a single runtime-selected enum —
# a build that could only construct some of its variants would just turn the
# unimplemented ones back into a silent no-op, the exact problem task #48 fixes.
# `dep:serde_json` is for (de)serializing `stt_google::GoogleSttCredentials` to/from
# the single JSON blob `credential_store` persists it as (see `build_stt_provider`).
live-transcription = ["windows-supervisor", "dep:serde_json", "dep:stt-api", "dep:stt-assemblyai", "dep:stt-deepgram", "dep:stt-google", "dep:stt-openai"]
