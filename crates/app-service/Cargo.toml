[package]
name = "app-service"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Orchestrates capture -> align -> segment -> upload for the meeting recorder. Stage 1: an OS-independent pipeline driven by a pseudo capture source, proving the wiring between audio-timeline, segment-store, session-store, and upload-client without any real OS capture backend."

[dependencies]
audio-timeline = { path = "../audio-timeline" }
capture-api = { path = "../capture-api", optional = true }
capture-macos = { path = "../capture-macos", optional = true }
capture-windows = { path = "../capture-windows", optional = true }
chrono = "0.4"
crossbeam-channel = { version = "0.5", optional = true }
recorder-domain = { path = "../recorder-domain" }
screencapturekit = { version = "8", features = ["macos_15_0"], optional = true }
segment-store = { path = "../segment-store" }
session-store = { path = "../session-store" }
thiserror = { workspace = true }
# "time" for the upload worker's retry-pacing sleep (task #11) — needed
# unconditionally since the upload worker itself is OS-independent, unlike
# windows-supervisor's own extra tokio features (see that feature below).
tokio = { version = "1", features = ["time"] }
tracing = { version = "0.1", optional = true }
upload-client = { path = "../upload-client" }
windows = { version = "0.58", features = ["Win32_Media_Audio", "Win32_System_Com"], optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
upload-client = { path = "../upload-client", features = ["mock-server"] }

[features]
# Task #1/#10: the Windows supervisor connecting capture-api's FSM to real
# capture-windows capture threads, and the conversion layer/session wiring that
# feeds its frames into stage 1's pipeline. Only meaningful on Windows
# (capture-windows itself is Windows-only) — this crate's default (no-features)
# build stays OS-independent for stage 1's pseudo-source pipeline and stage 3's
# upload worker/session lifecycle.
windows-supervisor = ["dep:capture-api", "dep:capture-windows", "dep:crossbeam-channel", "dep:tracing", "dep:windows", "tokio/rt"]

# The macOS analogue of windows-supervisor: connects capture-api's FSM to real
# capture-macos (ScreenCaptureKit) capture threads via macos_supervisor, plus the
# conversion layer/session wiring (macos_frame_collector/macos_session) that feeds
# its frames into stage 1's pipeline. Only meaningful on macOS (capture-macos
# itself is macOS-only, and — unlike capture-windows — has not yet been compiled or
# run at all; see capture-macos's crate doc comment).
macos-supervisor = ["dep:capture-api", "dep:capture-macos", "dep:crossbeam-channel", "dep:screencapturekit", "dep:tracing", "tokio/rt"]
