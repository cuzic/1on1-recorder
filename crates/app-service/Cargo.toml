[package]
name = "app-service"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Orchestrates capture -> align -> segment -> upload for the meeting recorder. Stage 1: an OS-independent pipeline driven by a pseudo capture source, proving the wiring between audio-timeline, segment-store, session-store, and upload-client without any real OS capture backend."

[dependencies]
audio-timeline = { path = "../audio-timeline" }
capture-api = { path = "../capture-api", optional = true }
capture-windows = { path = "../capture-windows", optional = true }
chrono = "0.4"
crossbeam-channel = { version = "0.5", optional = true }
recorder-domain = { path = "../recorder-domain" }
segment-store = { path = "../segment-store" }
session-store = { path = "../session-store" }
thiserror = { workspace = true }
tracing = { version = "0.1", optional = true }
upload-client = { path = "../upload-client" }
windows = { version = "0.58", features = ["Win32_Media_Audio", "Win32_System_Com"], optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
upload-client = { path = "../upload-client", features = ["mock-server"] }

[features]
# Task #1: the Windows supervisor connecting capture-api's FSM to real
# capture-windows capture threads. Only meaningful on Windows (capture-windows
# itself is Windows-only) — this crate's default (no-features) build stays
# OS-independent for stage 1's pseudo-source pipeline.
windows-supervisor = ["dep:capture-api", "dep:capture-windows", "dep:crossbeam-channel", "dep:tracing", "dep:windows"]
