[package]
name = "segment-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Opus/Ogg encoding and atomic segment commit (write .partial -> fsync -> hash -> rename -> register) for the meeting recorder, with restart-time recovery. Registers committed segments into session-store."

[dependencies]
ogg = "0.9"
opus = "0.3"
recorder-domain = { path = "../recorder-domain" }
session-store = { path = "../session-store" }
sha2 = "0.10"
thiserror = { workspace = true }

[dev-dependencies]
chrono = "0.4"
tempfile = "3"
