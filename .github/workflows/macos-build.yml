name: macOS Build & Test

# Tier 0 (`build`) is a blocking gate: compiles/lints/tests the main workspace with
# macOS's real capture backend (capture-macos, app-service's macos-supervisor
# feature) enabled. No TCC grant or real audio hardware is needed for this —
# see stt-transcription-architecture.md-style caveats throughout crates/capture-macos
# for what has and hasn't been verified.
#
# Tier 1 (`e2e-best-effort`) is explicitly NOT a reliable gate — see its own
# comments below. Real ScreenCaptureKit capture + TCC automation is genuinely
# fragile across macOS versions; even the `screencapturekit` crate's own upstream
# CI doesn't attempt this. Confident end-to-end verification still depends on a
# manual real-Mac pass (see the project's task list — the macOS analogue of
# Windows's task #9).
#
# Tier 1 also includes a device disconnect/reconnect pass ("Device
# disconnect/reconnect E2E" steps): it uninstalls/reinstalls the BlackHole
# virtual audio device mid-recording to exercise
# `MacosSupervisor::reconcile_device_list` (a6d66e9) against a real CoreAudio
# device-list-changed notification, and asserts the rebinding FSM's health
# (surfaced via `1on1ctl --json status`'s `capture_health` field) actually
# degrades to `Unavailable` and recovers back to `Ok` — not just that the
# process didn't crash.

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "apps/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - ".github/workflows/macos-build.yml"
  pull_request:
    paths:
      - "crates/**"
      - "apps/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # stt-google's build.rs (tonic-build/prost-build, task #42) shells out to
      # `protoc` to compile its vendored .proto file; macos-latest doesn't ship it,
      # so every build/clippy/test step below failed with "Could not find `protoc`"
      # from the moment stt-google was added until this step existed.
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build (capture-macos + app-service macos-supervisor feature)
        run: |
          cargo build -p capture-macos --target aarch64-apple-darwin
          cargo build -p app-service --features macos-supervisor --target aarch64-apple-darwin
          cargo build -p desktop --target aarch64-apple-darwin

      - name: Clippy
        # --no-deps scopes linting to capture-macos/app-service themselves, not
        # every workspace-local path dependency clippy walks into while building
        # them (e.g. audio-timeline) — this job's -D warnings gate is meant for
        # this macOS work specifically, not as a first-ever blanket clippy pass
        # over pre-existing, previously-unlinted code elsewhere in the workspace.
        run: |
          cargo clippy -p capture-macos --target aarch64-apple-darwin --no-deps -- -D warnings
          cargo clippy -p app-service --features macos-supervisor --target aarch64-apple-darwin --no-deps -- -D warnings

      - name: Test
        # No TCC grant or real audio hardware needed here: capture-macos's own
        # unit tests (e.g. timestamp::cmtime_to_ns) are pure arithmetic, and
        # app-service's macos_frame_collector tests construct fixture
        # CapturedFrameRecords directly rather than driving real ScreenCaptureKit.
        #
        # DYLD_LIBRARY_PATH=/usr/lib/swift: the screencapturekit/apple-cf crates'
        # Swift bridge links against libswift_Concurrency.dylib via an @rpath entry
        # that doesn't resolve at test-binary run time on the CI image, even though
        # the OS-shipped Swift runtime (present on macOS 12+) has it at this path —
        # a known class of issue with Rust binaries linking Swift-compiled code
        # (see e.g. https://forums.swift.org/t/42111). Pointing the dynamic linker
        # at the system runtime directly as a fallback resolves it without needing
        # to vendor/ship the library ourselves.
        env:
          DYLD_LIBRARY_PATH: /usr/lib/swift
        run: |
          cargo test -p capture-macos --target aarch64-apple-darwin
          cargo test -p app-service --features macos-supervisor --target aarch64-apple-darwin

  e2e-best-effort:
    runs-on: macos-latest
    needs: build
    # Job-level `permissions:` replaces (not adds to) the default token scopes —
    # `contents: read` must be listed explicitly or `actions/checkout` below (which
    # needs it to clone this private repo) fails with 403, silently, since this
    # whole job is `continue-on-error: true`.
    permissions:
      contents: read
      issues: write
    # This job is allowed to fail without turning the overall check red — real
    # ScreenCaptureKit capture requires TCC (Screen & System Audio Recording +
    # Microphone) permissions that cannot be granted through any documented,
    # stable API. The TCC.db sqlite3 approach below is a known community
    # workaround (see actions/runner-images#9529 and similar issues), not an
    # Apple-supported mechanism — its schema differs across macOS versions and it
    # has been reported to not reliably take effect depending on which process
    # actually invokes the capture. Treat a red/skipped result here as "unable to
    # verify automatically today", not as a real regression signal.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # Same reason as Tier 0's identical step: `desktop` (built later in this
      # job) depends on stt-google, whose build.rs shells out to `protoc` —
      # without this, "Build desktop + 1on1ctl" below fails with "Could not
      # find `protoc`" (confirmed: this job doesn't inherit Tier 0's protoc
      # setup, they're separate jobs/runners).
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Install BlackHole (virtual audio loopback, no kext required)
        run: brew install blackhole-2ch

      - name: Install switchaudio-osx (deterministic default-device selection)
        # The runner is a real Mac (built-in speakers exist), so BlackHole never
        # becomes the default output on its own the way it might on a device-less
        # headless box. `SwitchAudioSource` lets the device-disconnect/reconnect
        # steps below pin BlackHole as the default *before* `1on1ctl start` runs,
        # so `MacosSupervisor::resolve_current_defaults` actually binds
        # `EndpointLoopback` to it instead of the real speakers.
        run: brew install switchaudio-osx

      - name: Restart coreaudiod so BlackHole is picked up
        # BlackHole's own install docs describe a "restart when prompted" step,
        # which doesn't translate directly to a headless CI runner. Restarting
        # coreaudiod is the commonly-suggested non-reboot substitute — not yet
        # confirmed to reliably work in this specific CI environment.
        run: sudo killall coreaudiod || true

      - name: Set BlackHole as the default output device
        # Needed for both the plain smoke test below (a stable, controllable
        # output rather than whatever real hardware the runner happens to have)
        # and, more importantly, for the device-disconnect/reconnect steps
        # further down: `EndpointLoopback` only gets pinned to BlackHole if it's
        # the OS default *at the moment `1on1ctl start` resolves defaults*.
        run: SwitchAudioSource -s "BlackHole 2ch"

      - name: Pre-seed TCC permissions (best-effort, version-fragile)
        run: ./scripts/ci/seed-tcc-permissions.sh

      - name: Build smoke-test example
        run: cargo build -p capture-macos --example smoke_test --target aarch64-apple-darwin

      - name: Run capture smoke test
        id: smoke_test
        # See Tier 0's "Test" step for why DYLD_LIBRARY_PATH=/usr/lib/swift is
        # needed (screencapturekit/apple-cf's Swift bridge).
        env:
          DYLD_LIBRARY_PATH: /usr/lib/swift
        run: |
          ./target/aarch64-apple-darwin/debug/examples/smoke_test \
            --duration-secs 10 \
            --out /tmp/capture-macos-smoke-test.raw

      - name: Assert audio data was actually captured
        run: ./scripts/ci/assert-segment-written.sh /tmp/capture-macos-smoke-test.raw

      # 1on1ctl (apps/desktop-cli) end-to-end pass — see the Windows
      # workflow's identical comment for why this could never be verified
      # before now (the dev sandbox this was built in can't launch
      # dioxus-desktop's webview at all). Reuses this job's already-configured
      # BlackHole default recording device and TCC seeding above, since
      # `1on1ctl start` drives the same real ScreenCaptureKit capture path
      # the smoke test above just proved works on this runner.
      - name: Build desktop + 1on1ctl
        run: |
          cargo build -p desktop --target aarch64-apple-darwin
          cargo build -p desktop-cli --target aarch64-apple-darwin

      - name: 1on1ctl E2E — status/start against a real running app
        # `cargo build`'s own output layout (not `dx bundle`'s .app) puts
        # `1on1ctl` and `desktop` side by side in the same
        # target/aarch64-apple-darwin/debug/ directory — exactly what
        # `1on1ctl`'s `locate_gui_binary` (a sibling-of-`current_exe()`
        # lookup) expects, so no .app packaging step should be needed for the
        # auto-launch below to find `desktop`. DYLD_LIBRARY_PATH: see Tier 0's
        # "Test" step for why `desktop` (which links capture-macos) needs it.
        #
        # Left running (no `stop` here) — the device-disconnect/reconnect
        # steps below need a live session to observe `capture_health` against,
        # and the final "1on1ctl E2E — stop" step below tears it down.
        env:
          DYLD_LIBRARY_PATH: /usr/lib/swift
        timeout-minutes: 3
        run: |
          set -euo pipefail
          CTL=./target/aarch64-apple-darwin/debug/1on1ctl

          # No `desktop` is running yet — this specifically exercises
          # `1on1ctl`'s auto-launch-and-wait path, not just a plain connect.
          "$CTL" status

          # Consent is auto-confirmed by the control server for CLI-triggered
          # starts (see control_server.rs's dispatch) — no extra step needed.
          "$CTL" start

          sleep 5

          # `--json` rather than the human-readable output: both the
          # recording and not-recording branches of the plain-text output
          # literally start with the word "recording" (`recording: N経過` vs
          # `recording: 停止中`), so a plain substring match on that word
          # can't actually distinguish the two states.
          status_json="$("$CTL" --json status)"
          echo "$status_json"
          echo "$status_json" | grep -q '"recording":true' || { echo "expected status to report recording:true"; exit 1; }
          echo "$status_json" | grep -q '"remote_health":"Ok"' || { echo "expected remote_health to start Ok (was BlackHole actually pinned as the default output?)"; exit 1; }

      # The next two steps exercise a6d66e9's fix directly: a *pinned* (not
      # necessarily still-default) device disappearing mid-session. BlackHole is
      # pinned as `EndpointLoopback`'s target at session start above (it was the
      # default output at that moment); uninstalling it now is the closest a
      # headless CI runner can get to physically unplugging that device, and is
      # the same "restart coreaudiod to make the HAL plugin list change" trick
      # already used to install it — see that step's comment for the same
      # not-yet-confirmed-reliable caveat. `capture_api::rebinding`'s own
      # scenario tests (`crates/capture-api/tests/scenarios.rs`) already cover
      # this FSM transition in isolation; what only a real Mac can prove is that
      # `capture_macos::device_watch`'s CoreAudio listener actually fires and
      # `MacosSupervisor::reconcile_device_list` actually reacts to it.
      - name: Device disconnect E2E — uninstall BlackHole mid-recording
        timeout-minutes: 2
        run: |
          set -euo pipefail
          brew uninstall blackhole-2ch
          sudo killall coreaudiod || true

      - name: Device disconnect E2E — expect remote_health to report Unavailable
        # Per `crates/capture-api/src/rebinding.rs`'s `EndpointRemoved` handler,
        # a pinned endpoint disappearing moves that binding straight to
        # `Waiting { reason: DeviceUnavailable }`, i.e. `TrackHealth::Unavailable`
        # — no retry countdown, since there's nothing to retry until the device
        # (or a fresh `EndpointAdded`) is observed again.
        run: |
          set -euo pipefail
          CTL=./target/aarch64-apple-darwin/debug/1on1ctl
          ./scripts/ci/poll-capture-health.sh "$CTL" remote_health '"Unavailable"' 60

      - name: Device reconnect E2E — reinstall BlackHole
        # BlackHole's driver embeds a fixed device UID, so reinstalling hands
        # back the exact same `EndpointId` `MacosSupervisor` pinned at session
        # start — this is what lets `Observation::EndpointAdded` match it back
        # to the `Waiting` binding above instead of looking like an unrelated
        # new device. Re-selecting it as the default output isn't required for
        # that id-based match, but keeps the runner's audio state consistent
        # with what "Set BlackHole as the default output device" set up earlier.
        timeout-minutes: 2
        run: |
          set -euo pipefail
          brew install blackhole-2ch
          sudo killall coreaudiod || true
          SwitchAudioSource -s "BlackHole 2ch" || true

      - name: Device reconnect E2E — expect remote_health to recover to Ok
        # Longer timeout than the disconnect check: recovery goes through a real
        # `StartCapture` -> shared-`SCStream`-rebuild -> `WorkerStarted` round
        # trip (see macos_supervisor.rs's "Shared-stream reconciliation" doc
        # comment), not just an immediate state flip.
        run: |
          set -euo pipefail
          CTL=./target/aarch64-apple-darwin/debug/1on1ctl
          ./scripts/ci/poll-capture-health.sh "$CTL" remote_health '"Ok"' 90

      - name: 1on1ctl E2E — stop
        env:
          DYLD_LIBRARY_PATH: /usr/lib/swift
        timeout-minutes: 1
        run: |
          set -euo pipefail
          CTL=./target/aarch64-apple-darwin/debug/1on1ctl
          "$CTL" stop

      - name: Assert a session was actually written to disk
        # Confirms more than "the control socket answered" — that the full
        # start -> real ScreenCaptureKit capture -> stop -> session-store
        # pipeline ran to completion, the same way `assert-segment-written.sh`
        # does for the lower-level smoke test above.
        run: |
          set -euo pipefail
          sessions_root="$HOME/Library/Application Support/1on1-recorder/sessions"
          [ -d "$sessions_root" ] || { echo "sessions root not found: $sessions_root"; exit 1; }
          count=$(find "$sessions_root" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          [ "$count" -gt 0 ] || { echo "no session directories found under $sessions_root"; exit 1; }
          echo "Found $count session directory(ies)"

      - name: Print desktop app.log (diagnostics)
        # `desktop` is a GUI-subsystem exe with no console — `main.rs`'s
        # `init_logging` writes everything (including any capture-task error
        # surfaced by `recording::stop`'s `tracing::warn!`) to this file
        # instead. `if: always()` so this is visible whether the E2E step
        # above passed or failed.
        if: always()
        run: |
          log_path="$HOME/Library/Application Support/1on1-recorder/app.log"
          if [ -f "$log_path" ]; then cat "$log_path"; else echo "no app.log found at $log_path"; fi

      - name: Stop the desktop app
        # `desktop` hides to the tray rather than exiting on window close
        # (WindowCloseBehaviour::WindowHides) — kill it explicitly so it
        # doesn't linger past this job. `if: always()` so a failed assertion
        # above still cleans up rather than leaving the runner mid-recording.
        if: always()
        run: pkill -f "target/aarch64-apple-darwin/debug/desktop" || true

      - name: File an issue on failure (this job is continue-on-error, so nothing else surfaces this)
        # This job's own `continue-on-error: true` (see the comment at the top of
        # this job) means a real regression here produces no red check on the
        # PR/push — only a job log nobody opens unless they go looking. See
        # docs/adr/0002-macos-e2e-best-effort-job-silently-non-blocking.md for why
        # that's a problem this step exists to fix. Skipped on `pull_request`
        # (including from forks, where `GITHUB_TOKEN` is read-only anyway) to
        # avoid filing from untrusted/duplicate PR runs; `push`/`workflow_dispatch`
        # only. `poll-capture-health.sh`'s own FAIL message (in the job log this
        # issue links to) already distinguishes "ctl exited non-zero" from "health
        # never reached the expected value" — this step doesn't re-derive that,
        # it just makes sure someone looks.
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          # Fixed (no date suffix) so repeated failures dedupe against this exact
          # title instead of relying on a `--label` this repo doesn't have (and
          # this step deliberately doesn't create one — a missing/misspelled label
          # makes `gh issue create --label` fail outright, which is worse than not
          # labeling at all) or on GitHub's search-index-backed `gh issue list
          # --search`, which can lag.
          ISSUE_TITLE: "macOS e2e-best-effort job is failing"
        run: |
          set -euo pipefail
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json title \
            --jq --arg title "$ISSUE_TITLE" '[.[] | select(.title == $title)] | length')
          if [ "$existing" -gt 0 ]; then
            echo "\"$ISSUE_TITLE\" is already open; not filing another."
            exit 0
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "$ISSUE_TITLE" \
            --body "The \`e2e-best-effort\` job in \`macos-build.yml\` failed on [this run]($run_url) ($(date -u +%Y-%m-%dT%H:%MZ)). This job is \`continue-on-error: true\`, so it did not block the PR/push. Could be a real regression (device disconnect/reconnect health handling) or CI-environment flake (TCC seeding, BlackHole install/uninstall timing) — check the run log, especially any \`poll-capture-health.sh\` \`FAIL:\` line, to tell which. Close this issue once triaged; a future failure will only file a new one once this title is no longer open."
