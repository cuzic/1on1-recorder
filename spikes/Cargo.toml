[workspace]
resolver = "2"
members = [
    "spike-common",
    "spike-01-wasapi-dual-capture",
    "spike-02-app-loopback",
    "spike-12-rebinding-fsm",
    "spike-03-timeline-drift",
    "spike-08-chunked-upload",
    "spike-10-credential-store",
]

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
windows = { version = "0.58", features = [
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_Media_KernelStreaming",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Foundation",
    "Win32_System_Performance",
    # SPIKE-01実装で追加(spike-plan.md §1.4のB区分格上げに伴う実装時に判明):
    "Win32_Security",                    # CreateEventWがWin32_Security feature gate配下にある
    "Win32_UI_Shell_PropertiesSystem",   # IMMDevice::OpenPropertyStore/IPropertyStore
    "Win32_Devices_FunctionDiscovery",   # PKEY_Device_FriendlyName
    "Win32_System_ProcessStatus",        # K32GetProcessMemoryInfo(summary.jsonのpeak working set用)
    "Win32_System_SystemInformation",    # OSVERSIONINFOEXW(RtlGetVersionの引数型)
    # cargo checkで実際に検出した抜け(design.mdの§7で「要確認」としていた点):
    # このfeatureがないと`_Impl`トレイト自体が生成されず、
    # #[implement(...)]でCOMオブジェクト(CompletionHandler等)を実装できない。
    "implement",
] }
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
hound = "3"
crossbeam-channel = "0.5"
sysinfo = "0.31"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
