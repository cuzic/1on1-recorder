[package]
name = "spike-03-timeline-drift"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# spike-plan.md SPIKE-03: 「OS API 非依存の疑似キャプチャ」で完結する検証のため、
# windowsクレートに依存しない。resamplerクレート(rubatoなど)は評価した結果、
# 本スパイクが検証したいのは「比率がほぼ1.0近辺の緩やかなドリフト吸収」という
# 狭い用途であり、sinc補間ベースの汎用リサンプラーは過剰と判断し、
# 単純な線形補間リサンプラーを自前実装する(src/resample.rs参照)。
[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
hound = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "spike-03-timeline-drift"
path = "src/main.rs"
