[package]
name = "spike-02-app-loopback"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
spike-common = { path = "../spike-common" }
windows = { workspace = true }
# cargo checkで実際に検出した抜け: #[windows::core::implement(...)]マクロが
# 生成するコードは `windows_core::...` という直接のクレートパスを参照するため、
# windows crate経由の再エクスポート(windows::core)だけでは解決できない。
# windows-coreを直接の依存として追加する(windowsと同じバージョンに揃える)。
windows-core = "0.58"
clap = { workspace = true }
anyhow = { workspace = true }
crossbeam-channel = { workspace = true }
sysinfo = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
